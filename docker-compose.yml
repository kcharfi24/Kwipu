services:
  kwipu:
    build:
      context: .
      dockerfile: Dockerfile
    image: kwipu:latest
    container_name: kwipu-app
    restart: unless-stopped
    ports:
      - "8080:80"    # Unified Web UI + API (http://localhost:8080)
      - "8765:8765"  # Direct FastAPI Bridge (http://localhost:8765)
    environment:
      - KWIPU_ROOT_DIR=/app
      - KWIPU_KNOWLEDGE_DIR=knowledge_base
      - KWIPU_STORAGE_DIR=storage_graph
      - KWIPU_EMBED_MODEL=nomic-embed-text
      - KWIPU_LLM_MODEL=qwen2.5-coder:7b
      - KWIPU_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - KWIPU_ALLOW_INSECURE_REMOTE_OLLAMA=1
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8765
      - BRIDGE_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal,kwipu-app
      - BRIDGE_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./storage_graph:/app/storage_graph
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Development service for UI with HMR
  kwipu-ui-dev:
    image: node:22-alpine
    container_name: kwipu-ui-dev
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BRIDGE_TARGET=http://host.docker.internal:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - kwipu
