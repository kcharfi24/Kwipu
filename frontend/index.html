<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kwipu — Second Brain</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  </head>
  <body>
    <aside id="panel">
      <header class="brand">
        <div class="brand-row">
          <div>
            <h1>Kwipu</h1>
            <span class="subtitle">Second Brain · 3D</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle theme">☀️</button>
        </div>
      </header>

      <div id="stats" class="stats">loading…</div>

      <section class="ask">
        <textarea id="q" rows="2" placeholder="ask your notes&hellip;"></textarea>
        <button id="ask">Ask</button>
        <div id="ask-status" class="ask-status"></div>
      </section>

      <section class="answer" id="answer-box" hidden>
        <div class="answer-head">
          <div class="answer-label">Answer</div>
          <button id="copy-query-mermaid" class="link-btn" title="Copy active query subgraph as Mermaid diagram">export subgraph</button>
        </div>
        <div id="answer" class="answer-text"></div>
        <div id="cited" class="cited"></div>
        <button id="clear-highlight" class="link-btn">clear focus</button>
      </section>

      <section class="controls">
        <div class="group-label">Clusters & Categories</div>
        <div id="legend-pills" class="legend-pills"></div>
      </section>

      <section class="controls">
        <div class="group-label">View</div>
        <label>
          <input type="checkbox" id="opt-chunks" checked />
          include source chunks
        </label>
        <label>
          <input type="checkbox" id="opt-noisy" checked />
          drop noisy entities
        </label>
        <div class="range-row">
          <div class="head">
            <span>min degree</span>
            <span class="v" id="opt-mindeg-val">0</span>
          </div>
          <input type="range" id="opt-mindeg" min="0" max="6" value="0" />
        </div>
        <button id="reload">Reload graph</button>
      </section>

      <div id="hover" class="hover"><div class="empty">hover a node…</div></div>
    </aside>

    <main id="graph">
      <div class="graph-toolbar">
        <button id="btn-zoom-in" class="tool-btn" title="Zoom In">+</button>
        <button id="btn-zoom-out" class="tool-btn" title="Zoom Out">−</button>
        <button id="btn-fit" class="tool-btn" title="Fit Entire Graph">⤢ Fit</button>
        <button id="btn-reheat" class="tool-btn" title="Reheat / Relax Layout">⚡ Relax</button>
      </div>
    </main>
    <div class="scene-meta" id="scene-meta"></div>

    <section class="preview" id="preview" hidden>
      <div id="preview-handle" class="preview-handle"></div>
      <header class="preview-head">
        <div>
          <div class="preview-label">Source</div>
          <div class="preview-title" id="preview-title"></div>
        </div>
        <div class="preview-actions">
          <button class="link-btn" id="preview-copy-mermaid" title="Copy document relationships as Mermaid" style="display:none;"></button>
          <button class="preview-close" id="preview-close" aria-label="close">×</button>
        </div>
      </header>
      <div class="preview-body" id="preview-body"></div>
    </section>

    <!-- Modal for enlarged Mermaid diagrams -->
    <div id="mermaid-modal" class="modal" hidden>
      <div class="modal-content">
        <header class="modal-head">
          <span class="modal-title">Mermaid Diagram</span>
          <button id="mermaid-modal-close" class="modal-close" aria-label="close">&times;</button>
        </header>
        <div id="mermaid-modal-body" class="modal-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
